<!doctypehtml><html lang=zh-CN><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Imposter Cards · Depth Volume Viewer</title><style>body,html{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1018}canvas{display:block;width:100vw;height:100vh;outline:0;touch-action:none}#boot{position:absolute;top:20px;left:20px;color:#9de5cd;font:14px monospace;white-space:pre-wrap}</style></head><body><canvas id=canvas oncontextmenu=event.preventDefault() tabindex=0></canvas><pre id=boot>Loading Dear ImGui / WebGL2...</pre><input accept=.obj,.mtl,.png,.jpg,.jpeg,.tga,.bmp hidden id=files multiple type=file><output hidden id=app-state></output><script>var Module={canvas:document.getElementById("canvas"),print:console.log,printErr:e=>{console.error(e);const n=document.getElementById("boot");n.hidden=!1,n.textContent=e}};window.chooseModel=()=>document.getElementById("files").click(),document.getElementById("files").onchange=async e=>{try{const n=Array.from(e.target.files);for(const e of n)Module.FS.writeFile("/"+e.name,new Uint8Array(await e.arrayBuffer()));const t=n.find((e=>/\.obj$/i.test(e.name)));t&&Module.ccall("imp_load","number",["string"],["/"+t.name])}catch(e){Module.printErr(e.message)}}</script><script async src=imposter.js></script></body></html>
